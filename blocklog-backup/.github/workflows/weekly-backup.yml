name: Blocklog weekly backup
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node weekly.mjs
        env:
          APP_URL: ${{ secrets.APP_URL }}
          BLOCKLOG_EMAIL: ${{ secrets.BLOCKLOG_EMAIL }}
          BLOCKLOG_PASSWORD: ${{ secrets.BLOCKLOG_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PILOT_NAME: ${{ secrets.PILOT_NAME }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
